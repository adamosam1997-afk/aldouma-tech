<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل مع المطور | التقني الدومة</title>

    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===============================
           CSS Variables (الهوية البصرية)
           =============================== */
        :root {
            --primary-color: #0b2b26; /* الأخضر الداكن */
            --accent-color: #f9c74f;  /* الذهبي/الأصفر */
            --accent-hover: #e0b03b;
            --bg-light: #f8fafc;      
            --text-dark: #1e2a3e;
            --text-muted: #64748b;
            --white: #ffffff;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px -5px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s ease;
            --whatsapp-color: #25D366;
        }

        /* ===============================
           Global Styles (الإعدادات العامة)
           =============================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--primary-color);
            /* استخدام صورة المطور كخلفية */
            background-image: url('assets/images/Adam.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-dark);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* طبقة تعتيم فوق الخلفية لبروز النصوص */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(11, 43, 38, 0.85); /* أخضر داكن شفاف */
            backdrop-filter: blur(5px);
            z-index: -1;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===============================
           Header & Navigation (الترويسة)
           =============================== */
        header {
            background: rgba(11, 43, 38, 0.98);
            backdrop-filter: blur(10px);
            padding: 0.8rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            z-index: 1001;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 0.5rem;
            align-items: center;
        }

        nav ul li a {
            color: var(--white);
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            transition: var(--transition);
            font-size: 1rem;
        }

        nav ul li a:hover,
        nav ul li a.active {
            background: var(--accent-color);
            color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(249, 199, 79, 0.3);
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 1001;
            transition: var(--transition);
        }

        /* ===============================
           Main Content (محتوى الصفحة)
           =============================== */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem 1rem;
        }

        .contact-card {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 30px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.8s ease-out;
        }

        .contact-icon-top {
            font-size: 3rem;
            color: var(--accent-color);
            background: #fef3c7;
            width: 90px;
            height: 90px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .title {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            font-weight: 600;
        }

        .contact-box {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        /* تعديل مكان أيقونة الرسالة لتكون في الأعلى */
        .input-group.textarea-group i {
            top: 25px;
        }

        .contact-box input,
        .contact-box textarea {
            width: 100%;
            padding: 16px 50px 16px 20px; /* مساحة للأيقونة */
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
            background: var(--white);
            color: var(--text-dark);
        }

        .contact-box textarea {
            resize: vertical;
            min-height: 150px;
        }

        .contact-box input:focus,
        .contact-box textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(11, 43, 38, 0.1);
        }

        .contact-box input:focus + i,
        .contact-box textarea:focus + i {
            color: var(--primary-color);
        }

        .btn {
            background: var(--whatsapp-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
            background: #1ebe5d;
        }

        /* ===============================
           Footer (الفوتر)
           =============================== */
        footer {
            background: #081f1b;
            color: #a0aec0;
            text-align: center;
            padding: 2rem;
            border-top: 4px solid var(--accent-color);
        }

        .footer-content p {
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .footer-content strong {
            color: var(--accent-color);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .social-links a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--white);
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .social-links a:hover {
            background: var(--accent-color);
            color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(249, 199, 79, 0.3);
        }

        /* زر العودة للأعلى */
        #backToTop {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--accent-color);
            color: var(--primary-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            box-shadow: var(--shadow-md);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 999;
        }

        #backToTop.show {
            opacity: 1;
            visibility: visible;
        }

        #backToTop:hover {
            background: var(--white);
            transform: translateY(-5px);
        }

        /* ===============================
           Animations
           =============================== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===============================
           Responsive Design (التجاوب)
           =============================== */
        @media (max-width: 900px) {
            .menu-toggle {
                display: block;
            }

            nav {
                position: fixed;
                top: 0;
                right: -100%;
                width: 70%;
                height: 100vh;
                background: var(--primary-color);
                box-shadow: -5px 0 15px rgba(0,0,0,0.2);
                transition: 0.4s ease-in-out;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }

            nav.active {
                right: 0;
            }

            nav ul {
                flex-direction: column;
                gap: 1.5rem;
                width: 100%;
                text-align: center;
            }

            nav ul li {
                width: 100%;
            }

            nav ul li a {
                display: block;
                padding: 1rem;
                font-size: 1.2rem;
                border-radius: 0;
            }

            .contact-card {
                padding: 2rem 1.5rem;
            }

            .title {
                font-size: 1.8rem;
            }

            .contact-icon-top {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <!-- بداية الترويسة -->
    <header>
        <div class="logo">التقني الدومة</div>
        
        <button class="menu-toggle" id="menuToggle" aria-label="فتح القائمة">
            <i class="fas fa-bars"></i>
        </button>

        <nav id="navbar">
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="games.html">الألعاب</a></li>
                <li><a href="app.html">التطبيقات</a></li>
                <li><a href="tutorials.html">الشروحات</a></li>
                <li><a href="videos.html">الفيديوهات</a></li>
                <li><a href="contact.html" class="active">تواصل</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-card">
            <div class="contact-icon-top">
                <i class="fas fa-paper-plane"></i>
            </div>

            <h1 class="title">تواصل مع المطور</h1>
            <p class="subtitle">لديك فكرة مشروع أو استفسار؟ اكتب رسالتك وسيتم تحويلك لواتساب مباشرة.</p>

            <div class="contact-box">
                <div class="input-group">
                    <input type="text" id="name" placeholder="اكتب اسمك الكريم هنا" required>
                    <i class="fas fa-user"></i>
                </div>

                <div class="input-group textarea-group">
                    <textarea id="message" rows="5" placeholder="اكتب تفاصيل رسالتك هنا..." required></textarea>
                    <i class="fas fa-comment-dots"></i>
                </div>

                <button class="btn" onclick="sendToWhatsApp()">
                    <i class="fab fa-whatsapp" style="font-size: 1.5rem;"></i>
                    إرسال عبر واتساب
                </button>
            </div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer>
        <div class="footer-content">
            <p>جميع الحقوق محفوظة © <strong>التقني الدومة - آدم عصام</strong> 2026</p>
            <div class="social-links">
                <a href="https://www.facebook.com/" aria-label="Facebook" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="https://github.com/adamosam1997-afk" aria-label="GitHub" target="_blank"><i class="fab fa-github"></i></a>
                <a href="contact.html" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </footer>

    <!-- زر العودة للأعلى -->
    <button id="backToTop" aria-label="العودة للأعلى">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- السكريبت الخاص بالتصميم -->
    <script>
        // 1. قائمة الهواتف (Hamburger Menu)
        const menuToggle = document.getElementById('menuToggle');
        const navbar = document.getElementById('navbar');

        menuToggle.addEventListener('click', () => {
            navbar.classList.toggle('active');
            const icon = menuToggle.querySelector('i');
            if (navbar.classList.contains('active')) {
                icon.classList.replace('fa-bars', 'fa-times');
            } else {
                icon.classList.replace('fa-times', 'fa-bars');
            }
        });

        document.querySelectorAll('nav ul li a').forEach(link => {
            link.addEventListener('click', () => {
                navbar.classList.remove('active');
                menuToggle.querySelector('i').classList.replace('fa-times', 'fa-bars');
            });
        });

        // 2. زر العودة للأعلى
        const backToTopBtn = document.getElementById("backToTop");
        
        window.addEventListener("scroll", () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add("show");
            } else {
                backToTopBtn.classList.remove("show");
            }
        });

        backToTopBtn.addEventListener("click", () => {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });

        // 3. وظيفة إرسال الواتساب
        function sendToWhatsApp() {
            let name = document.getElementById("name").value.trim();
            let message = document.getElementById("message").value.trim();

            if (name === "" || message === "") {
                alert("الرجاء كتابة الاسم والرسالة قبل الإرسال.");
                return;
            }

            let phoneNumber = "249124975562";
            // ترميز النص ليدعم الرموز والمسافات في الرابط
            let text = encodeURIComponent(`مرحباً، معك ${name}\n\n${message}`);
            let url = `https://wa.me/${phoneNumber}?text=${text}`;

            window.open(url, '_blank');
        }
    </script>

</body>
</html>
